name: Redeploy

# Manually trigger a Vercel redeploy by pushing an empty commit to main.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Push empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "ci: rebuild" -m "Triggered by @${{ github.actor }}"
          git push origin main
